<svg id="quadrantchart" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 500px; background-color: white;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#quadrantchart{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#quadrantchart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#quadrantchart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#quadrantchart .error-icon{fill:#552222;}#quadrantchart .error-text{fill:#552222;stroke:#552222;}#quadrantchart .edge-thickness-normal{stroke-width:1px;}#quadrantchart .edge-thickness-thick{stroke-width:3.5px;}#quadrantchart .edge-pattern-solid{stroke-dasharray:0;}#quadrantchart .edge-thickness-invisible{stroke-width:0;fill:none;}#quadrantchart .edge-pattern-dashed{stroke-dasharray:3;}#quadrantchart .edge-pattern-dotted{stroke-dasharray:2;}#quadrantchart .marker{fill:#333333;stroke:#333333;}#quadrantchart .marker.cross{stroke:#333333;}#quadrantchart svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#quadrantchart p{margin:0;}#quadrantchart :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="5" width="232" height="232" fill="#ECECFF"/><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 10) rotate(0)"></text></g><g class="quadrant"><rect x="31" y="5" width="232" height="232" fill="#f1f1ff"/><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 10) rotate(0)"></text></g><g class="quadrant"><rect x="31" y="237" width="232" height="232" fill="#f6f6ff"/><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 242) rotate(0)"></text></g><g class="quadrant"><rect x="263" y="237" width="232" height="232" fill="#fbfbff"/><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 242) rotate(0)"></text></g></g><g class="border"><line x1="30" y1="5" x2="496" y2="5" style="stroke: hsl(240, 60%, 86.2745098039%); stroke-width: 2;"/><line x1="495" y1="6" x2="495" y2="468" style="stroke: hsl(240, 60%, 86.2745098039%); stroke-width: 2;"/><line x1="30" y1="469" x2="496" y2="469" style="stroke: hsl(240, 60%, 86.2745098039%); stroke-width: 2;"/><line x1="31" y1="6" x2="31" y2="468" style="stroke: hsl(240, 60%, 86.2745098039%); stroke-width: 2;"/><line x1="263" y1="6" x2="263" y2="468" style="stroke: hsl(240, 60%, 86.2745098039%); stroke-width: 1;"/><line x1="32" y1="237" x2="494" y2="237" style="stroke: hsl(240, 60%, 86.2745098039%); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="123.80000000000001" cy="329.8" r="5" fill="rgb(185, 185, 255)" stroke="rgb(185, 185, 255)" stroke-width="0px"/><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(123.80000000000001, 334.8) rotate(0)">Item</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 353) rotate(-90)">Low</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 121) rotate(-90)">High</text></g></g><g class="title"></g></g></svg>
