<svg id="merman" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 547.53125 450" style="max-width: 547.531px; background-color: white;" role="graphics-document document" aria-roledescription="pie"><style>#merman{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#merman .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#merman .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#merman .error-icon{fill:#552222;}#merman .error-text{fill:#552222;stroke:#552222;}#merman .edge-thickness-normal{stroke-width:1px;}#merman .edge-thickness-thick{stroke-width:3.5px;}#merman .edge-pattern-solid{stroke-dasharray:0;}#merman .edge-thickness-invisible{stroke-width:0;fill:none;}#merman .edge-pattern-dashed{stroke-dasharray:3;}#merman .edge-pattern-dotted{stroke-dasharray:2;}#merman .marker{fill:#333333;stroke:#333333;}#merman .marker.cross{stroke:#333333;}#merman svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#merman p{margin:0;}#merman .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#merman .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#merman .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#merman .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#merman .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#merman :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,1,1,0,185A185,185,0,1,1,0,-185Z" fill="#ECECFF" class="pieCircle"/><text transform="translate(0,138.75)" class="slice" style="text-anchor: middle;">100%</text><text x="0" y="-200" class="pieTitleText">Pets</text><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"/><text x="22" y="14">Dogs</text></g></g></svg>
